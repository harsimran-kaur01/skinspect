services:
  - type: web
    name: skinspect-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: skinspect-frontend
          property: host

staticSites:
  - name: skinspect-frontend
    rootDir: skinspect-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: skinspect-backend
          property: host
